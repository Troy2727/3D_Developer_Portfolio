<svg viewBox="0 0 840 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-dark-title arch-dark-desc"><title id="arch-dark-title">How alexportfolio.net works</title><desc id="arch-dark-desc">A visitor loads a single-page React 19 app in the browser, which renders the Three.js 3D scenes, runs GSAP scroll animations, and sends the contact form through EmailJS. Every push to main on GitHub is linted and built by GitHub Actions and deployed by Vercel.</desc><defs><marker id="arch-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/></marker><marker id="arch-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00e5ff"/></marker><marker id="arch-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#818cf8"/></marker></defs><rect width="100%" height="100%" fill="#0a0a0b"/><g data-t="0.0" data-k="zone"><rect x="204" y="24" width="624" height="376" rx="8" fill="rgba(0,229,255,0.03)" stroke="rgba(0,229,255,0.55)" stroke-width="1" stroke-dasharray="4,4"/><rect x="216" y="16" width="128" height="16" rx="2" fill="#0a0a0b"/><text x="280" y="28" fill="#00e5ff" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">IN THE BROWSER</text></g>
